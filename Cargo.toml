[package]
name = "typescript-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "A native TypeScript syntax parser with a JSON AST command line interface"
license = "MIT"

[lib]
name = "typescript_parser"

[[bin]]
name = "tsparse"
path = "src/main.rs"

[dependencies]
nom = "8.0.0"
memchr = "=2.7.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-id-start = "=1.5.0"
smallvec = { version = "=1.15.1", features = ["union"] }
num-bigint = "=0.4.6"
ryu = "=1.0.20"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "memory"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

# Tests spend most of their time in the parser and checker, which opt-level 1
# runs about three times faster; debug assertions and overflow checks stay on.
# A build from scratch takes longer, and a rebuild after a change costs about
# the same (docs/validation.md#selecting-rust-tests).
[profile.test]
opt-level = 1

[[bench]]
name = "references"
harness = false

[[bench]]
name = "navigation"
harness = false
